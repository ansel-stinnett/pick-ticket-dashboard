<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Pick Tickets</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f1117; color: #e8eaf0; min-height: 100vh; padding: 24px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #2a2d3a; padding-bottom: 16px; }
  header h1 { font-size: 28px; font-weight: 600; }
  .meta { display: flex; align-items: center; gap: 24px; font-size: 14px; color: #8a8fa8; }
  .summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 10px; padding: 16px 20px; }
  .stat-label { font-size: 12px; color: #8a8fa8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .stat-value { font-size: 32px; font-weight: 600; }
  .stat-value.total { color: #7b8cde; }
  .stat-value.green { color: #4caf7d; }
  .stat-value.yellow { color: #f0c060; }
  .stat-value.red { color: #e05f5f; }
  .controls { display: flex; gap: 24px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .controls label { font-size: 13px; color: #8a8fa8; margin-right: 8px; }
  .controls select { background: #1a1d27; border: 1px solid #2a2d3a; color: #c0c4d8; border-radius: 6px; padding: 6px 12px; font-size: 13px; }
  .legend { display: flex; gap: 20px; margin-bottom: 20px; font-size: 13px; color: #8a8fa8; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.green { background: #4caf7d; }
  .dot.yellow { background: #f0c060; }
  .dot.red { background: #e05f5f; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th { text-align: left; font-size: 12px; font-weight: 600; color: #8a8fa8; text-transform: uppercase; letter-spacing: 0.8px; padding: 10px 14px; border-bottom: 1px solid #2a2d3a; }
  tbody tr { border-bottom: 1px solid #1e2130; }
  tbody td { padding: 12px 14px; vertical-align: middle; }
  .age-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
  .age-badge.green { background: #1a3328; color: #4caf7d; }
  .age-badge.yellow { background: #332d14; color: #f0c060; }
  .age-badge.red { background: #331a1a; color: #e05f5f; }
  .age-bar-wrap { display: flex; align-items: center; gap: 10px; }
  .age-bar { height: 6px; border-radius: 3px; min-width: 4px; }
  .age-bar.green { background: #4caf7d; }
  .age-bar.yellow { background: #f0c060; }
  .age-bar.red { background: #e05f5f; }
  .ticket-no { font-family: 'Courier New', monospace; color: #7b8cde; font-weight: 600; }
  .order-no { font-family: 'Courier New', monospace; color: #c0c4d8; }
  .po-no { font-family: 'Courier New', monospace; color: #9a9fb8; font-size: 13px; }
  .cust-name { color: #e8eaf0; }
  .value-cell { font-family: 'Courier New', monospace; color: #6dd49a; text-align: right; }
  .lines-cell { text-align: center; color: #9a9fb8; }
  .promise-cell { font-size: 13px; }
  .promise-ok { color: #9a9fb8; }
  .promise-late { color: #e05f5f; font-weight: 600; }
  .promise-tag { background: #331a1a; color: #e05f5f; border-radius: 4px; padding: 2px 7px; font-size: 11px; margin-left: 6px; }
   tr.row-late { background: #2a1414; }
   tr.row-late:hover { background: #331a1a; }
  .picker-badge { background: #1e2130; border: 1px solid #2a2d3a; border-radius: 6px; padding: 3px 10px; font-size: 13px; color: #c0c4d8; }
  .picker-none { color: #4a4f66; font-style: italic; font-size: 13px; }
  .loc-badge { background: #1e2130; border: 1px solid #2a2d3a; border-radius: 6px; padding: 3px 8px; font-size: 12px; color: #9a9fb8; }
  .pickup-tag { background: #2a2417; color: #d4a843; border-radius: 4px; padding: 2px 7px; font-size: 11px; margin-left: 6px; }
  .error-msg { background: #331a1a; border: 1px solid #5a2a2a; border-radius: 10px; padding: 20px 24px; color: #e05f5f; font-size: 14px; margin-top: 40px; }
  .loading { text-align: center; padding: 60px; color: #8a8fa8; font-size: 16px; }
  #refresh-btn { background: #1a1d27; border: 1px solid #2a2d3a; color: #c0c4d8; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  #refresh-btn:hover { background: #2a2d3a; }
  .empty-state { text-align: center; padding: 60px; color: #4a4f66; font-size: 16px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>&#128230; Open Pick Tickets</h1>
  <div class="meta">
    <span id="last-updated">Last updated: -</span>
    <span>Next refresh: <span id="countdown">10:00</span></span>
    <button id="refresh-btn" onclick="loadData()">&#8635; Refresh Now</button>
  </div>
</header>
<div class="summary-bar">
  <div class="stat-card"><div class="stat-label">Total Open</div><div class="stat-value total" id="stat-total">-</div></div>
  <div class="stat-card"><div class="stat-label">&#128994; Fresh (&lt;4h)</div><div class="stat-value green" id="stat-green">-</div></div>
  <div class="stat-card"><div class="stat-label">&#128993; Aging (4-8h)</div><div class="stat-value yellow" id="stat-yellow">-</div></div>
  <div class="stat-card"><div class="stat-label">&#128308; Overdue (&gt;8h)</div><div class="stat-value red" id="stat-red">-</div></div>
</div>
<div class="controls">
  <div>
    <label>Location:</label>
    <select id="loc-select" onchange="sortAndRender()"><option value="all">All locations</option></select>
  </div>
  <div>
    <label>Sort by:</label>
    <select id="sort-select" onchange="sortAndRender()">
      <option value="newest">Newest first (most recent)</option>
      <option value="oldest">Oldest first (longest open)</option>
      <option value="promise_late">Most past-due promise</option>
      <option value="customer_az">Customer (A-Z)</option>
      <option value="customer_za">Customer (Z-A)</option>
      <option value="value_high">Value (high to low)</option>
      <option value="value_low">Value (low to high)</option>
    </select>
  </div>
</div>
<div class="legend">
  <span class="legend-item"><span class="dot green"></span> &lt; 4 hours</span>
  <span class="legend-item"><span class="dot yellow"></span> 4-8 hours</span>
  <span class="legend-item"><span class="dot red"></span> &gt; 8 hours</span>
</div>
<div id="table-container" class="table-wrap">
  <div class="loading">Loading pick tickets...</div>
</div>
<script>
var countdownSeconds = 600;
var countdownInterval = null;
var allTickets = [];

var LOCATIONS = {
  11: 'Warehouse 11',
  12: 'Warehouse 12',
  13: 'Warehouse 13',
  14: 'Warehouse 14',
  21: 'Warehouse 21',
  31: 'Warehouse 31',
  41: 'Warehouse 41',
  43: 'Warehouse 43',
  51: 'Warehouse 51',
  63: 'Warehouse 63',
  13779: 'Warehouse 13779',
  17875: 'Warehouse 17875',
  18080: 'Warehouse 18080',
  22249: 'Warehouse 22249'
};

function locName(id) {
  return LOCATIONS[id] || ('Location ' + id);
}

function getAgeClass(hours) {
  if (hours < 4) return 'green';
  if (hours <= 8) return 'yellow';
  return 'red';
}

function formatAge(hours, days) {
  if (days >= 1) return days === 1 ? '1 day' : days + ' days';
  if (hours === 0) return '< 1h';
  return hours + 'h';
}

function formatMoney(val) {
  if (val === null || val === undefined) return '-';
  var n = parseFloat(val);
  if (isNaN(n)) return '-';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatDateShort(dtStr) {
  if (!dtStr) return null;
  var s = dtStr.toString().replace('T', ' ');
  var m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s;
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m[2],10)-1] + ' ' + parseInt(m[3],10);
}

function formatDate(dtStr) {
  if (!dtStr) return '-';
  try {
    var s = dtStr.toString().replace('T', ' ');
    var m = s.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
    if (!m) return s;
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var hr = parseInt(m[4], 10);
    var min = m[5];
    var ampm = hr >= 12 ? 'PM' : 'AM';
    hr = hr % 12 || 12;
    return months[parseInt(m[2],10)-1] + ' ' + parseInt(m[3],10) + ' ' + hr + ':' + min + ' ' + ampm;
  } catch(e) { return dtStr; }
}

function renderPromise(t) {
  var dateStr = formatDateShort(t.promise_date);
  if (!dateStr) return '<span class="promise-ok">-</span>';
  var past = t.days_past_promise;
  if (past !== null && past !== undefined && past > 0) {
    var label = past === 1 ? '1 day late' : past + ' days late';
    return '<span class="promise-late">' + dateStr + '</span><span class="promise-tag">' + label + '</span>';
  }
  return '<span class="promise-ok">' + dateStr + '</span>';
}

function populateLocations() {
  var locs = {};
  for (var i = 0; i < allTickets.length; i++) {
    var l = allTickets[i].location_id;
    if (l !== null && l !== undefined) locs[l] = true;
  }
  var sel = document.getElementById('loc-select');
  var current = sel.value;
  var keys = Object.keys(locs).sort(function(a,b){ return a-b; });
  sel.innerHTML = '<option value="all">All locations</option>';
  for (var i = 0; i < keys.length; i++) {
    var opt = document.createElement('option');
    opt.value = keys[i];
    opt.textContent = locName(keys[i]);
    sel.appendChild(opt);
  }
  sel.value = current;
}

function renderTable(tickets) {
  var container = document.getElementById('table-container');
  if (!tickets || tickets.length === 0) {
    container.innerHTML = '<div class="empty-state">No open pick tickets for this filter</div>';
    document.getElementById('stat-total').textContent = '0';
    document.getElementById('stat-green').textContent = '0';
    document.getElementById('stat-yellow').textContent = '0';
    document.getElementById('stat-red').textContent = '0';
    return;
  }
  var green = 0, yellow = 0, red = 0;
  var maxHours = 1;
  for (var i = 0; i < tickets.length; i++) {
    var h = tickets[i].hours_open || 0;
    if (h > maxHours) maxHours = h;
  }
  var rowsHtml = '';
  for (var i = 0; i < tickets.length; i++) {
    var t = tickets[i];
    var hours = t.hours_open || 0;
    var cls = getAgeClass(hours);
    if (cls === 'green') green++;
    else if (cls === 'yellow') yellow++;
    else red++;
    var barWidth = Math.round(Math.min((hours / maxHours) * 120, 120));
    var pickup = (t.will_call === 'Y' || t.front_counter === 'Y') ? '<span class="pickup-tag">PICKUP</span>' : '';
    var cust = (t.ship2_name || '-') + pickup;
    var po = t.po_no ? t.po_no : '-';
    var loc = (t.location_id !== null && t.location_id !== undefined) ? '<span class="loc-badge">' + locName(t.location_id) + '</span>' : '-';
    var lines = (t.line_count !== null && t.line_count !== undefined) ? t.line_count : '-';
    var value = formatMoney(t.order_value);
    var promise = renderPromise(t);
    var rowCls = (t.days_past_promise !== null && t.days_past_promise !== undefined && t.days_past_promise > 0) ? ' class="row-late"' : '';
    rowsHtml += '<tr><td class="ticket-no">' + t.pick_ticket_no + '</td><td class="cust-name">' + cust + '</td><td class="order-no">' + (t.order_no || '-') + '</td><td class="po-no">' + po + '</td><td>' + loc + '</td><td class="lines-cell">' + lines + '</td><td class="value-cell">' + value + '</td><td class="promise-cell">' + promise + '</td><td>' + (t.taker || '-') + '</td><td>' + formatDate(t.date_created) + '</td><td><div class="age-bar-wrap"><div class="age-bar ' + cls + '" style="width:' + barWidth + 'px"></div><span class="age-badge ' + cls + '">' + formatAge(hours, t.days_open) + '</span></div></td></tr>';
  }
  document.getElementById('stat-total').textContent = tickets.length;
  document.getElementById('stat-green').textContent = green;
  document.getElementById('stat-yellow').textContent = yellow;
  document.getElementById('stat-red').textContent = red;
  container.innerHTML = '<table><thead><tr><th>Pick Ticket</th><th>Customer</th><th>Order No</th><th>PO No</th><th>Location</th><th>Lines</th><th>Value</th><th>Promise Date</th><th>Taker</th><th>Created</th><th>Age</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>';
}

function resetCountdown() {
  countdownSeconds = 600;
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(function() {
    countdownSeconds--;
    var m = Math.floor(countdownSeconds / 60);
    var s = countdownSeconds % 60;
    document.getElementById('countdown').textContent = m + ':' + (s < 10 ? '0' : '') + s;
    if (countdownSeconds <= 0) loadData();
  }, 1000);
}

function sortAndRender() {
  var sortVal = document.getElementById('sort-select').value;
  var locVal = document.getElementById('loc-select').value;
  var filtered = allTickets.filter(function(t) {
    if (locVal === 'all') return true;
    return String(t.location_id) === String(locVal);
  });
  var sorted = filtered.slice().sort(function(a, b) {
    if (sortVal === 'oldest') return (b.hours_open || 0) - (a.hours_open || 0);
    if (sortVal === 'customer_az') return (a.ship2_name || '').localeCompare(b.ship2_name || '');
    if (sortVal === 'customer_za') return (b.ship2_name || '').localeCompare(a.ship2_name || '');
    if (sortVal === 'value_high') return (parseFloat(b.order_value) || 0) - (parseFloat(a.order_value) || 0);
    if (sortVal === 'value_low') return (parseFloat(a.order_value) || 0) - (parseFloat(b.order_value) || 0);
    if (sortVal === 'promise_late') {
      var pa = (a.days_past_promise === null || a.days_past_promise === undefined) ? -99999 : a.days_past_promise;
      var pb = (b.days_past_promise === null || b.days_past_promise === undefined) ? -99999 : b.days_past_promise;
      return pb - pa;
    }
    return (a.hours_open || 0) - (b.hours_open || 0);
  });
  renderTable(sorted);
}

function loadData() {
  document.getElementById('last-updated').textContent = 'Refreshing...';
  resetCountdown();
  fetch('/api/pick-tickets')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      allTickets = data;
      populateLocations();
      sortAndRender();
      document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
    })
    .catch(function(err) {
      document.getElementById('table-container').innerHTML = '<div class="error-msg"><strong>Could not load data.</strong><br><br>' + err.message + '</div>';
      document.getElementById('last-updated').textContent = 'Last updated: failed';
    });
}

loadData();

// Auto-scroll for TV display
var autoScrollEnabled = true;
var scrollPaused = false;

function autoScrollStep() {
  if (!autoScrollEnabled || scrollPaused) return;
  var atBottom = (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 5);
  if (atBottom) {
    scrollPaused = true;
    setTimeout(function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(function() { scrollPaused = false; }, 3000);
    }, 4000);
  } else {
    window.scrollBy(0, 1);
  }
}
setInterval(autoScrollStep, 30);

// Pause auto-scroll when someone interacts, resume after 30s idle
var idleTimer = null;
function pauseScroll() {
  autoScrollEnabled = false;
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(function() { autoScrollEnabled = true; }, 30000);
}
window.addEventListener('mousemove', pauseScroll);
window.addEventListener('mousedown', pauseScroll);
window.addEventListener('keydown', pauseScroll);
window.addEventListener('wheel', pauseScroll);
</script>
</body>
</html>
